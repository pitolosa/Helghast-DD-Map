name: Post Deep Desert map

on:
  schedule:
    # Every 30 minutes: picks up a new map week (Tuesdays) and Officer
    # "!base" commands in #deep-desert. Most runs only take a few seconds;
    # the browser is installed only when a new map actually needs drawing.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post the map again even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deep-desert-map
  cancel-in-progress: false

jobs:
  post-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for a new week or !base commands
        id: check
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FORCE_POST: ${{ github.event.inputs.force || 'false' }}
        run: python post_map.py check

      - name: Install browser
        if: steps.check.outputs.render == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Draw map and post to Discord
        if: steps.check.outputs.render == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FORCE_POST: ${{ github.event.inputs.force || 'false' }}
        run: python post_map.py post

      - name: Save state
        if: always()
        run: |
          git config user.name "deep-desert-bot"
          git config user.email "deep-desert-bot@users.noreply.github.com"
          git add -A state.json last_posted.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Deep Desert map state update"
            git push
          fi
