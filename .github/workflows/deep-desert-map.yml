name: Post Deep Desert map

on:
  schedule:
    - cron: "0 */2 * * 2,3"
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if this week's map was already posted"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deep-desert-map
  cancel-in-progress: false

jobs:
  post-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Screenshot map and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_POST: ${{ github.event.inputs.force || 'false' }}
        run: python post_map.py

      - name: Save which week was posted
        run: |
          if [[ -n "$(git status --porcelain last_posted.txt)" ]]; then
            git config user.name "deep-desert-bot"
            git config user.email "deep-desert-bot@users.noreply.github.com"
            git add last_posted.txt
            git commit -m "Posted Deep Desert map: $(cat last_posted.txt)"
            git push
          fi
