name: Server status

on:
  schedule:
    # Every 15 minutes (GitHub often runs these later than scheduled).
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: server-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Update #server-status
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DUNE_WORLD: "Tagir"
          STATUS_CHANNEL_ID: "1560693654849454253"
          COUNTER_CHANNEL_ID: "1560694019221094420"
        run: python server_status.py
