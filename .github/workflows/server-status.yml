name: Server status

on:
  schedule:
    # Every 15 minutes (GitHub often runs these later than scheduled).
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: server-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Update #server-status
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DUNE_WORLD: "Tagir"
          STATUS_CHANNEL_ID: "1560693654849454253"
          HOME_SIETCH: "Hajar"
        run: python server_status.py
